services:
  opa:
    image: openpolicyagent/opa:${OPA_VERSION:-0.70.0}
    container_name: ${OPA_CONTAINER_NAME:-identity-os-opa}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=debug
      - /policies
    ports:
      - "${OPA_PORT:-8181}:8181"
    volumes:
      - ./policies:/policies:ro
